<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

</head>

<body>

    <h1>My To-Do List</h1>

    <h2>Add a New Task</h2>

    <form>

        <input
            type="text"
            placeholder="Enter your task">

        <button type="submit">
            Add Task
        </button>

    </form>

    <h2>My Tasks</h2>

    <ul>

        <li>Complete Web Development Assignment</li>

        <li>Study HTML Concepts</li>

        <li>Practice Programming</li>

        <li>Complete Project Work</li>

        <li>Submit Project Report</li>

    </ul>

</body>

</html>
